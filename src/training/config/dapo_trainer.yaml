hydra:
  run:
    dir: out/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ['data/rl_train.parquet']
  val_files: ['data/rl_train.parquet']
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 768
  train_batch_size: 8
  gen_batch_size: ${data.train_batch_size}
  shuffle: True
  filter_overlong_prompts: True
  filter_overlong_prompts_workers: 1
  dataloader_num_workers: 0
  truncation: left
  train_max_samples: -1
  val_max_samples: -1
  trust_remote_code: True

actor_rollout_ref:
  model:
    path: ${oc.env:GRM_MODEL_NAME}
    override_config:
      torch_dtype: bfloat16
      attn_implementation: sdpa
    use_remove_padding: False
    trust_remote_code: True
  actor:
    strategy: fsdp
    fsdp_config:
      optimizer_offload: true   # Offload Adam states to CPU (~32GB savings)
      grad_offload: true        # Offload gradients to CPU (~8GB savings)
    rollout_n: ${actor_rollout_ref.rollout.n}
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1   # Reduced from 2 to save activation memory
    ppo_max_token_len_per_gpu: 4096   # Reduced from 8192 to save memory
    ppo_epochs: 1
    shuffle: False
    use_dynamic_bsz: False
    entropy_coeff: 0.0
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    use_kl_loss: False
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 1.0
      weight_decay: 0.1
      total_training_steps: ${trainer.total_training_steps}
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    do_sample: True
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    log_prob_micro_batch_size_per_gpu: 1
    dtype: bfloat16
    gpu_memory_utilization: 0.4   # Reduced from 0.5 to leave more room for actor training
    max_model_len: 2048  # prompt(1024)+response(768)=1792; avoids 40K default
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 256
    enforce_eager: True
    free_cache_engine: True
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0.0
      n: 1
      do_sample: False

critic:
  enable: False

reward_model:
  enable: False
  use_reward_loop: False
  reward_manager: dapo
  launch_reward_fn_async: False

reward_manager:
  source: importlib
  name: MetaConsensusRewardManager
  module:
    path: src/training/meta_reward_manager.py
    name: meta_reward_manager

custom_reward_function:
  path: null
  name: compute_score

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

trainer:
  project_name: grm-dapo
  experiment_name: consensus_dapo
  logger: ['console']
  nnodes: 1
  n_gpus_per_node: 1
  total_epochs: 1
  total_training_steps: ${oc.decode:${oc.env:RL_TOTAL_STEPS,1000}}
  save_freq: -1
  test_freq: -1
  val_before_train: False
  val_only: False
  resume_mode: disable
  default_local_dir: out/rl
  device: cuda

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        HF_HOME: data
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""

global_profiler:
  steps: null
