hydra:
  run:
    dir: out/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ['data/rl_train_healthbench.parquet']   # HealthBench-only for faster RL validation
  val_files: ['data/rl_train_healthbench.parquet']
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 1024  # Reduced from 1536; rubrics are ~500-800 tokens when concise
  train_batch_size: 8
  gen_batch_size: ${data.train_batch_size}
  shuffle: True
  filter_overlong_prompts: False   # Already pre-filtered, skip 10-min runtime filter
  filter_overlong_prompts_workers: 1
  dataloader_num_workers: 0
  truncation: left
  train_max_samples: -1
  val_max_samples: -1
  trust_remote_code: True

actor_rollout_ref:
  model:
    path: ${oc.env:GRM_MODEL_NAME}
    override_config:
      torch_dtype: bfloat16
      attn_implementation: sdpa
    use_remove_padding: False
    trust_remote_code: True
  actor:
    strategy: fsdp
    fsdp_config:
      param_offload: True  # offload FSDP params to CPU during rollout for GPU memory
    rollout_n: ${actor_rollout_ref.rollout.n}
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 2
    ppo_max_token_len_per_gpu: 8192
    ppo_epochs: 3
    shuffle: False
    use_dynamic_bsz: False
    # Entropy warmup: start high, decay to min over warmup_steps.
    # Actual scheduling is done in ray_trainer.py _update_actor() via meta_info.
    entropy_coeff: 0.002
    entropy_coeff_min: 0.001        # floor after warmup
    entropy_warmup_steps: 50        # linear decay from entropy_coeff → entropy_coeff_min
    entropy_cap: 2.0                # smooth scaling: bonus linearly decays to 0 at 2x cap (4.0)
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    use_kl_loss: True               # Enable KL loss to prevent policy drift from SFT
    kl_loss_coef: 0.025             # KL penalty: 0.01→0.025 to constrain policy drift & entropy explosion
    kl_loss_type: low_var_kl        # Lower-variance KL estimator
    optim:
      lr: 5e-6
      lr_warmup_steps_ratio: 0.05   # 5% warmup (constant schedule with warmup)
      min_lr_ratio: 1.0
      weight_decay: 0.01
      total_training_steps: ${trainer.total_training_steps}
  rollout:
    name: vllm
    mode: async
    n: 8                            # 8 rollouts per prompt for stable GRPO advantages
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    do_sample: True
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    log_prob_micro_batch_size_per_gpu: 2
    dtype: bfloat16
    gpu_memory_utilization: 0.30
    max_model_len: 2048             # prompt(1024)+response(1024)=2048
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 128               # rollout batch = train_batch 8 × n 8 = 64 seqs max
    enforce_eager: True
    free_cache_engine: True
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0.0
      n: 1
      do_sample: False
  ref:
    log_prob_micro_batch_size_per_gpu: 2
    fsdp_config:
      param_offload: True  # offload ref model params to CPU

critic:
  enable: False

reward_model:
  enable: False
  use_reward_loop: False
  reward_manager: dapo
  launch_reward_fn_async: False

reward_manager:
  source: importlib
  name: MetaConsensusRewardManager
  module:
    path: src/training/meta_reward_manager.py
    name: meta_reward_manager

custom_reward_function:
  path: null
  name: compute_score

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

trainer:
  project_name: grm-dapo
  experiment_name: consensus_dapo
  logger: ['console']
  nnodes: 1
  n_gpus_per_node: 1   # GPU 0 for actor+rollout; GPU 1 reserved for solver/oracle vLLM
  total_epochs: 1
  total_training_steps: ${oc.decode:${oc.env:RL_TOTAL_STEPS,1000}}
  save_freq: 20
  test_freq: 99999
  val_before_train: False
  val_only: False
  resume_mode: auto
  default_local_dir: out/rl
  device: cuda

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        HF_HOME: data
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""

global_profiler:
  steps: null
