actor_rollout_ref:
  rollout:
    log_prob_micro_batch_size: 16
    tensor_model_parallel_size: 1
    name: "grm_rollout"
  model:
    path: "Qwen/Qwen2.5-7B-Instruct" # Replace with actual GRM path
    use_remove_padding: True
    enable_gradient_checkpointing: True
  ref:
    log_prob_micro_batch_size: 16
    tensor_model_parallel_size: 1

critic:
  optim:
    lr: 1e-5
  model:
    path: "Qwen/Qwen2.5-7B-Instruct" # Usually same base as actor
    use_remove_padding: True
    enable_gradient_checkpointing: True
    tensor_model_parallel_size: 1

algorithm:
  kl_ctrl:
    kl_coef: 0.001
    type: "fixed"
  adv_estimator: "gae"
  gamma: 1.0
  lam: 0.95

trainer:
  total_epochs: 1
  total_training_steps: 100
  project_name: "meta-reward-grm"
  experiment_name: "grm_ppo"
  logger: ["wandb"]
  nnodes: 1
  n_gpus_per_node: 1

data:
  train_files: ["data/synthetic_rubrics.jsonl"]
  val_files: []
  prompt_key: "question"
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 64
  micro_batch_size: 4
  return_raw_chat: False
