hydra:
  searchpath:
    - file://.venv/lib/python3.12/site-packages/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: false
  save_path: "outputs/profile"

# Algorithm settings for GRPO
algorithm:
  _target_: verl.trainer.config.AlgoConfig
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.001

data:
  tokenizer: null
  train_files: ['data/synthetic_rubrics.parquet']
  val_files: ['data/synthetic_rubrics.parquet']
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 512
  train_batch_size: 8
  gen_batch_size: ${data.train_batch_size}
  val_batch_size: null
  return_raw_input_ids: False
  return_raw_chat: False
  return_full_prompt: False
  shuffle: True
  validation_shuffle: False
  filter_overlong_prompts: True
  filter_overlong_prompts_workers: 1
  dataloader_num_workers: 0
  truncation: left
  image_key: images
  video_key: videos
  trust_remote_code: True
  custom_cls:
    path: null
    name: null

actor_rollout_ref:
  hybrid_engine: true
  model:
    _target_: verl.workers.config.HFModelConfig
    path: ${oc.env:GRM_MODEL_NAME}
    custom_chat_template: null
    use_shm: false
    external_lib: null
    override_config:
      torch_dtype: bfloat16
      attn_implementation: sdpa
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: false
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
    use_liger: false
    use_fused_kernels: false
    fused_kernel_options:
      impl_backend: torch
    trust_remote_code: true
  actor:
    _target_: verl.workers.config.FSDPActorConfig
    strategy: fsdp
    rollout_n: ${actor_rollout_ref.rollout.n}
    ppo_mini_batch_size: 8
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 8192
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    policy_loss:
      loss_mode: "vanilla"
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0.001
    use_kl_loss: false
    use_torch_compile: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    checkpoint:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
    optim:
      _target_: verl.workers.config.FSDPOptimizerConfig
      optimizer: AdamW
      optimizer_impl: torch.optim
      lr: 1e-6
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 1.0
      total_training_steps: ${trainer.total_training_steps}
      weight_decay: 0.1
      betas: [0.9, 0.999]
    fsdp_config:
      _target_: verl.workers.config.engine.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1
  ref:
    _target_: verl.workers.config.RefConfig
    strategy: ${actor_rollout_ref.actor.strategy}
    fsdp_config:
      _target_: verl.workers.config.engine.FSDPEngineConfig
      param_offload: false
      reshard_after_forward: true
      forward_prefetch: False
      wrap_policy:
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
  rollout:
    _target_: verl.workers.config.RolloutConfig
    name: vllm
    mode: sync
    temperature: 1.0
    top_k: -1
    top_p: 1
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.4
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    layered_summon: False
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_parallel_size: 1
    max_num_batched_tokens: 4096
    max_model_len: null
    max_num_seqs: 256
    log_prob_micro_batch_size: 4
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True
    do_sample: True
    n: 4
    multi_stage_wake_up: false
    engine_kwargs:
      vllm: {}
      sglang: {}
    val_kwargs:
      _target_: verl.workers.config.SamplingConfig
      top_k: -1
      top_p: 1.0
      temperature: 0.7
      n: 4
      do_sample: True
    multi_turn:
      _target_: verl.workers.config.MultiTurnConfig
      enable: False
      max_assistant_turns: null
      tool_config_path: null
      max_user_turns: null
      interaction_config_path: null
      use_inference_chat_template: False
      tokenization_sanity_check_mode: strict
      format: hermes
    calculate_log_probs: False

# Disable critic for GRPO
critic:
  _target_: verl.workers.config.CriticConfig
  enable: False
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: ${actor_rollout_ref.actor.strategy}
  optim:
    _target_: verl.workers.config.FSDPOptimizerConfig
    optimizer: AdamW
    optimizer_impl: torch.optim
    lr: 1e-5
    lr_warmup_steps_ratio: 0.
    min_lr_ratio: null
    total_training_steps: -1
    weight_decay: 0.01
    betas: [0.9, 0.999]
  model:
    _target_: verl.workers.config.critic.FSDPCriticModelCfg
    path: ${actor_rollout_ref.model.path}
    use_shm: False
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config:
      torch_dtype: bfloat16
      attn_implementation: flash_attention_2
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: ${actor_rollout_ref.model.enable_gradient_checkpointing}
    use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}
    trust_remote_code: ${actor_rollout_ref.model.trust_remote_code}
    fsdp_config:
      _target_: verl.workers.config.engine.FSDPEngineConfig
      wrap_policy:
        min_num_params: 0
      param_offload: False
      reshard_after_forward: True

reward_model:
  enable: False
  launch_reward_fn_async: false

trainer:
  balance_batch: true
  total_epochs: 1
  total_training_steps: 2
  project_name: grm-grpo
  experiment_name: grpo_qwen3_4b
  logger: ['console']
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: -1
  esi_redundant_time: 0
  resume_mode: disable
  resume_from_path: null
  val_before_train: false
  val_only: false
  test_freq: 1
  critic_warmup: 0
  default_hdfs_dir: null
  default_local_dir: checkpoints/grpo
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  device: cuda
  use_legacy_worker_impl: auto
  del_local_ckpt_after_load: true
