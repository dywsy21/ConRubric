[project]
name = "meta-reward-grm"
version = "0.1.0"
description = "Meta-Reward General Reward Model Training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "vllm>=0.2.6",
    "ray>=2.9.0",
    "verl", # VolcEngine Reinforcement Learning library
    "numpy",
    "pandas",
    "openai", # For Oracle/Judge API calls
    "tyro", # For configuration management
    "wandb", # For logging
    "tqdm",
    "python-dotenv",
    "huggingface_hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Optional: specific sources if verl needs to be installed from git
# sources = { verl = { git = "https://github.com/volcengine/verl.git" } }
