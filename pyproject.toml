[project]
name = "meta-reward-grm"
version = "0.1.0"
description = "Meta-Reward General Reward Model Training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ── Core ML ──
    "torch==2.5.1",
    "transformers>=4.46.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "flash-attn",
    "numpy<2.0.0",

    # ── verl core deps (from volcengine/verl setup.py install_requires) ──
    "codetiming",
    "dill",
    "hydra-core",
    "omegaconf",
    "pandas",
    "peft",
    "pyarrow>=19.0.0",
    "pybind11",
    "pylatexenc",
    "ray[default]>=2.41.0",
    "torchdata",
    "tensordict>=0.8.0,<=0.10.0,!=0.9.0",
    "wandb",
    "packaging>=20.0",
    "tensorboard",

    # ── verl extras: vllm ──
    "vllm>=0.8.5,<=0.12.0",

    # ── verl extras: trl ──
    "trl<=0.9.6",

    # ── GRM-specific ──
    "openai",
    "tyro",
    "tqdm",
    "python-dotenv",
    "huggingface_hub",
    "uvloop",
    "scipy",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "verl"]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.0.post2/flash_attn-2.7.0.post2+cu12torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
