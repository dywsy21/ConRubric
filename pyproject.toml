[project]
name = "meta-reward-grm"
version = "0.1.0"
description = "Meta-Reward General Reward Model Training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "vllm>=0.8.5,<=0.11.0",
    "ray>=2.50.1",
    "numpy",
    "pandas",
    "openai", # For Oracle/Judge API calls
    "tyro", # For configuration management
    "wandb", # For logging
    "tqdm",
    "python-dotenv",
    "huggingface_hub",
    "flash-attn",
    "trl",
    "uvloop"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "verl"]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.0.post2/flash_attn-2.7.0.post2+cu12torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
